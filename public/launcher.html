<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BEAn — open app</title>
    <style>
      :root {
        --bg: #0a0c10;
        --text: #e8eaef;
        --muted: #8b93a7;
        --accent: #34d399;
        --border: rgba(255, 255, 255, 0.1);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        flex-shrink: 0;
        padding: 0.65rem 1rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem 1rem;
        background: rgba(0, 0, 0, 0.35);
      }
      header h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
      }
      header label {
        font-size: 0.8rem;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      select {
        background: #12151c;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.35rem 0.5rem;
        font-size: 0.8rem;
        max-width: min(520px, 100%);
      }
      #status {
        font-size: 0.75rem;
        color: var(--muted);
        margin-left: auto;
      }
      #status.ok {
        color: var(--accent);
      }
      #status.err {
        color: #f87171;
      }
      a.tab {
        font-size: 0.8rem;
        color: var(--accent);
      }
      .frame-wrap {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        background: #000;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>BEAn</h1>
      <label>
        Load app from
        <select id="target" aria-label="App URL">
          <option value="http://127.0.0.1:3001">
            127.0.0.1:3001 — production (npm run build && npm start)
          </option>
          <option value="http://127.0.0.1:5173">
            127.0.0.1:5173 — Vite dev (npm run dev)
          </option>
        </select>
      </label>
      <span id="status">Checking API on :3001…</span>
      <a class="tab" id="openTab" href="http://127.0.0.1:3001" target="_blank" rel="noopener"
        >Open in new tab</a
      >
    </header>
    <div class="frame-wrap">
      <iframe
        id="app"
        title="BEAn app"
        src="http://127.0.0.1:3001"
        allow="clipboard-read; clipboard-write"
      ></iframe>
    </div>
    <script>
      (function () {
        var API = "http://127.0.0.1:3001/api/health";
        var select = document.getElementById("target");
        var iframe = document.getElementById("app");
        var status = document.getElementById("status");
        var openTab = document.getElementById("openTab");

        function setIframe(url) {
          iframe.src = url;
          openTab.href = url;
        }

        select.addEventListener("change", function () {
          setIframe(select.value);
        });

        fetch(API, { method: "GET", mode: "cors" })
          .then(function (r) {
            return r.ok ? r.json() : Promise.reject(new Error(String(r.status)));
          })
          .then(function (data) {
            status.className = "ok";
            status.textContent =
              "API :3001 — openai:" +
              !!data.openai +
              " anthropic:" +
              !!data.anthropic +
              " fal:" +
              !!data.fal +
              " reve:" +
              !!data.reve;
          })
          .catch(function () {
            status.className = "err";
            status.textContent =
              "API :3001 unreachable — start the server (npm run dev:server or production start).";
          });
      })();
    </script>
  </body>
</html>
